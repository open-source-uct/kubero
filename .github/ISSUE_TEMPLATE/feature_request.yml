name: Proponer una funcionalidad
description: Sugiere una mejora para Kubero UCT
labels: ["Idea/discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Explica la necesidad y el resultado deseado. No incluyas secretos ni datos privados.
  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad
      description: Describe quién tiene este problema y en qué situación aparece.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Describe el comportamiento esperado desde la perspectiva del usuario.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - Dado..., cuando..., entonces...
        - ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componentes que podrían cambiar
      multiple: true
      options:
        - Cliente / UI
        - Servidor / API
        - Plantillas de servicios
        - Integración con CLI u operador
        - Documentación
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Impacto en contratos o integración
      description: Indica si se espera cambiar API, autenticación, datos, despliegue, CLI, operador o CRDs.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
