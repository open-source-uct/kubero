name: Reportar un error
description: Informa un fallo reproducible en Kubero UCT
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe el problema sin publicar contraseñas, tokens, kubeconfigs ni datos privados.
        Si sospechas una vulnerabilidad, coordina un canal privado con los mantenedores antes de compartir detalles.
  - type: dropdown
    id: component
    attributes:
      label: Componente afectado
      multiple: true
      options:
        - Cliente / UI
        - Servidor / API
        - Plantillas de servicios
        - Integración con CLI u operador
        - Documentación
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Versión y entorno
      description: Versión de Kubero, navegador y Kubernetes si corresponde.
      placeholder: "Ej.: Kubero 2.x, Chrome, Kubernetes 1.x"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abre...
        2. Ejecuta...
        3. Observa...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado real
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia depurada
      description: Adjunta capturas o fragmentos de logs solo después de eliminar datos sensibles.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impacto
      description: Indica a quién afecta, frecuencia y si existe una solución temporal. No publiques detalles de explotación.
    validations:
      required: false
